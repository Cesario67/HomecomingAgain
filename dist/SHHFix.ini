; SHHFix : réglages. Valeurs absentes ou invalides : valeurs par défaut. 0 = désactivé, 1 = activé.

[Crash]
; Fichier de diagnostic (minidump) écrit en cas de plantage, dans SHHFix\crashdumps.
CrashDumps=1
; 1 = dump complet (jusqu'à 2 Go) au lieu d'un dump réduit.
FullMemoryDumps=0
DumpKeepCount=10

[Frames]
; Mesures de cadence, d'attente (Sleep) et de mémoire dans le journal.
FrameStats=1
ReportIntervalSeconds=10
; Résolution du minuteur Windows en ms (0 = ne pas la modifier).
TimerResolutionMs=1
; Limiteur d'images (0 = aucun).
FrameLimitFps=0

[Debug]
LogKeepCount=10
