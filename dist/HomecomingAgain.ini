; HomecomingAgain : réglages. Valeurs absentes ou invalides : valeurs par défaut. 0 = désactivé, 1 = activé.

[Crash]
; Fichier de diagnostic (minidump) écrit en cas de plantage, dans HomecomingAgain\crashdumps.
CrashDumps=1
; 1 = dump complet (jusqu'à 2 Go) au lieu d'un dump réduit.
FullMemoryDumps=0
DumpKeepCount=10
; Secondes sans image avant un diagnostic de blocage (pile des threads + minidump). 0 = désactivé.
HangSeconds=3

[Window]
; Mode fenêtré du jeu (FullScreen=false dans le fichier vars_pc.cfg du jeu) sans bordure, étendu au moniteur.
Borderless=1

[Graphics]
; Anticrénelage SMAA (préréglage élevé) appliqué à l'image finale. 0 = désactivé.
SMAA=1
; Filtrage anisotrope forcé (2 à 16, 0 = jeu d'origine) : textures nettes au sol et de biais.
Anisotropy=16
; Taille de l'atlas d'ombres : 2048 (jeu d'origine), 4096 ou 8192. Plus grand = ombres plus fines ;
; 8192 fait apparaître des défauts sur les vêtements (constaté le 10/10/2026).
ShadowResolution=4096
; Occlusion ambiante (SSAO) : léger assombrissement dans les coins et au contact des objets.
SSAO=1
; Rayon de l'effet en unités du jeu, intensité en % (100 = normale), fondu entre deux distances.
SsaoRadius=1.5
SsaoStrength=100
SsaoFadeStart=150
SsaoFadeEnd=450
; 1 = afficher l'occlusion seule (en noir et blanc) pour régler le rayon.
SsaoDebug=0
; Grain de pellicule du jeu en % (100 = jeu d'origine, 50 = moitié, 0 = aucun).
FilmGrain=100
; Expérimental (préparation du DLSS) : Direct3D 9 du jeu exécuté par Direct3D 12 (D3D9On12 de Windows).
D3D9On12=0

[Frames]
; Mesures de cadence, d'attente (Sleep) et de mémoire dans le journal.
FrameStats=1
ReportIntervalSeconds=10
; Résolution du minuteur Windows en ms (0 = ne pas la modifier).
TimerResolutionMs=1
; Limiteur d'images (0 = aucun).
FrameLimitFps=0
; Cadence du moteur, limitée à 30 i/s en dur dans le jeu d'origine (0 = garder 30). Les réglages fpsLimit
; du fichier vars_pc.cfg du jeu n'ont pas d'effet sur ce plafond.
TargetFps=60

[Compat]
; Évite le blocage au chargement en fenêtré avec l'overlay Steam (le jeu reste réactif aux messages).
WindowThreadLock=1
; Direct3D protégé contre les appels simultanés des threads de chargement et principal (blocages au chargement).
D3DMultithreaded=1

[Debug]
LogKeepCount=10
; Relevé d'images (diagnostic pour le DLSS) : la touche enregistre les 2 images suivantes dans
; HomecomingAgain\captures. Code de touche Windows : 122 = F11.
FrameCapture=0
FrameCaptureKey=122
; Enregistre l'image affichée toutes les 15 s (8 fois) dans HomecomingAgain\captures (écran noir).
BackBufferDump=0
; Option de test : le jeu ne lit plus ses vidéos (cinématiques), pour arriver plus vite en jeu.
SkipMovies=0
