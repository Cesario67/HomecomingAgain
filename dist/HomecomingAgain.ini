; HomecomingAgain : réglages. Valeurs absentes ou invalides : valeurs par défaut. 0 = désactivé, 1 = activé.
; HomecomingAgain: settings. Missing or invalid values: defaults. 0 = disabled, 1 = enabled.

[Crash]
; Fichier de diagnostic (minidump) écrit en cas de plantage, dans HomecomingAgain\crashdumps.
; Diagnostic file (minidump) written on a crash, in HomecomingAgain\crashdumps.
CrashDumps=1
; 1 = dump complet (jusqu'à 2 Go) au lieu d'un dump réduit.
; 1 = full dump (up to 2 GB) instead of a small one.
FullMemoryDumps=0
; Nombre de dumps conservés (les plus anciens sont supprimés).
; Number of dumps kept (the oldest are deleted).
DumpKeepCount=10
; Secondes sans image avant un diagnostic de blocage (pile des threads + minidump). 0 = désactivé.
; Seconds without a frame before a freeze diagnostic (thread stacks + minidump). 0 = disabled.
HangSeconds=3

[Window]
; Mode fenêtré du jeu (FullScreen=false dans le fichier vars_pc.cfg du jeu) sans bordure, étendu au moniteur.
; The game's windowed mode (FullScreen=false in the game's vars_pc.cfg) without borders, stretched to the monitor.
Borderless=1

[Graphics]
; Anticrénelage SMAA (préréglage élevé) appliqué à l'image finale. 0 = désactivé.
; SMAA anti-aliasing (high preset) applied to the final image. 0 = disabled.
SMAA=1
; Filtrage anisotrope forcé (2 à 16, 0 = jeu d'origine) : textures nettes au sol et de biais.
; Forced anisotropic filtering (2 to 16, 0 = original game): sharp textures on the ground and at an angle.
Anisotropy=16
; Taille de l'atlas d'ombres : 2048 (jeu d'origine), 4096 ou 8192. Plus grand = ombres plus fines ;
; les défauts des vêtements en 8192 sont corrigés (décalage de pente adapté à la taille de l'atlas, 13/10/2026).
; Shadow atlas size: 2048 (original game), 4096 or 8192. Larger = finer shadows;
; the clothing artifacts at 8192 are fixed (slope bias adapted to the atlas size, 13/10/2026).
ShadowResolution=8192
; Occlusion ambiante (SSAO) : léger assombrissement dans les coins et au contact des objets.
; Ambient occlusion (SSAO): slight darkening in corners and where objects touch.
SSAO=1
; Rayon de l'effet en unités du jeu, intensité en % (100 = normale), fondu entre deux distances.
; Effect radius in game units, strength in % (100 = normal), fade between two distances.
SsaoRadius=1.5
SsaoStrength=100
SsaoFadeStart=150
SsaoFadeEnd=450
; 1 = afficher l'occlusion seule (en noir et blanc) pour régler le rayon.
; 1 = show the occlusion alone (in black and white) to tune the radius.
SsaoDebug=0
; Grain de pellicule du jeu en % (100 = jeu d'origine, 50 = moitié, 0 = aucun).
; The game's film grain in % (100 = original game, 50 = half, 0 = none).
FilmGrain=100
; Carte coupée au-delà de 1280x720 : la zone fixe du jeu est étendue à toute l'image. 1 = oui.
; Map cut off above 1280x720: the game's fixed area is extended to the whole image. 1 = yes.
FullScreenUiClip=1
; Écran noir hors 16:9 (ultra-large) : le rectangle de la dernière copie du jeu sort de l'image, il est rogné. 1 = oui.
; Black screen in non 16:9 resolutions (ultrawide): the rectangle of the game's last copy leaves the image, it is clipped. 1 = yes.
ClipFinalCopy=1
; Ultra-large (prototype) : champ de vision horizontal élargi au lieu de rogner le haut et le bas. 1 = oui.
; Ultrawide (prototype): wider horizontal field of view instead of cropping the top and bottom. 1 = yes.
HorPlus=0
; Experimental (Hor+) : le moteur construit lui-même sa projection et son frustum de culling avec le ratio de l'écran. 1 = oui.
; Experimental (Hor+): the engine builds its own projection and culling frustum with the screen ratio. 1 = yes.
HorPlusEngine=1
; Vue d'inspection des objets (couteau...) déformée au-delà de 720p : perspective rétablie. 1 = oui.
; Item inspection view (knife...) distorted above 720p: perspective restored. 1 = yes. Also relights the journal
; photos and documents, which are black above 720p (the light is pushed away from the picture).
ObjectViewPerspective=1
; Expérimental (préparation du DLSS) : Direct3D 9 du jeu exécuté par Direct3D 12 (D3D9On12 de Windows).
; Experimental (DLSS groundwork): the game's Direct3D 9 run through Direct3D 12 (Windows' D3D9On12).
D3D9On12=0

[Frames]
; Mesures de cadence, d'attente (Sleep) et de mémoire dans le journal.
; Frame rate, wait (Sleep) and memory measurements in the log.
FrameStats=1
; Secondes entre deux rapports de mesures.
; Seconds between two measurement reports.
ReportIntervalSeconds=10
; Résolution du minuteur Windows en ms (0 = ne pas la modifier).
; Windows timer resolution in ms (0 = leave it alone).
TimerResolutionMs=1
; Limiteur d'images (0 = aucun).
; Frame limiter (0 = none).
FrameLimitFps=0
; Cadence du moteur, limitée à 30 i/s en dur dans le jeu d'origine (0 = garder 30). Les réglages fpsLimit
; du fichier vars_pc.cfg du jeu n'ont pas d'effet sur ce plafond.
; Engine frame rate, hard-capped at 30 fps in the original game (0 = keep 30). The fpsLimit settings
; in the game's vars_pc.cfg have no effect on this cap.
TargetFps=60

[Compat]
; Évite le blocage au chargement en fenêtré avec l'overlay Steam (le jeu reste réactif aux messages).
; Avoids the freeze while loading in windowed mode with the Steam overlay (the game keeps answering messages).
WindowThreadLock=1
; Direct3D protégé contre les appels simultanés des threads de chargement et principal (blocages au chargement).
; Direct3D protected against simultaneous calls from the loading and main threads (freezes while loading).
D3DMultithreaded=1
; Missing game texts (some prompts such as "Examine / Inventory" in the French, German, Italian and Spanish files) added
; by the launcher to Engine\gameinfo\strings, with a copy of the original files. 0 = original files restored when
; saving from the launcher. Read by the launcher only, not by the DLL.
MissingTexts=1

[Audio]
; Canaux de sortie : 0 = ceux de Windows (jeu d'origine), 6 = 5.1, 8 = 7.1.
; Output channels: 0 = those of Windows (original game), 6 = 5.1, 8 = 7.1.
Channels=0
; Corrige les sons envoyés d'un seul côté (mélange vers la stéréo fait par le mod). 0 = jeu d'origine.
; Fixes sounds sent to one side only (mixed down to stereo by the mod). 0 = original game.
ChannelFix=1
; Ordre de correction : pour AvG, AvD, centre, basses, ArG, ArD, numéro du canal du jeu (0 à 5).
; Correction order: for FL, FR, center, LFE, RL, RR, the game's channel number (0 to 5).
ChannelOrder=2,4,1,3,5,0

[DLSS]
; Expérimental (sous DXVK) : images de la scène partagées avec le processus DLSS.
; Experimental (under DXVK): scene frames shared with the DLSS process.
ShareFrames=0
; Décalage de caméra (jitter) pour le DLSS, en pixels : 0 = aucun, 1 = normal. Sans DLSS, l'image tremble.
; Exige ShareFrames=1.
; Camera offset (jitter) for DLSS, in pixels: 0 = none, 1 = normal. Without DLSS, the image shakes.
; Requires ShareFrames=1.
Jitter=0
; Image traitée par le DLSS (mode DLAA) rendue au jeu : 1 = oui. Exige ShareFrames=1 et Jitter=1.
; Image processed by DLSS (DLAA mode) handed back to the game: 1 = yes. Requires ShareFrames=1 and Jitter=1.
Apply=0

[Movies]
; Touche pour passer les cinématiques en vidéo (code de touche Windows : 46 = Suppr, 0 = aucune).
; Key to skip video cutscenes (Windows key code: 46 = Delete, 0 = none).
SkipKey=46
; Logos de démarrage (Konami, Double Helix, mentions légales, environ 20 s) accélérés jusqu'à l'écran titre : 1 = oui.
; Startup logos (Konami, Double Helix, legal notices, about 20 s) sped up to the title screen: 1 = yes.
SkipLogos=1

[Input]
; Icônes de boutons à l'écran : 0 = auto (PS3 avec une manette PlayStation, Xbox 360 avec une autre manette, sinon
; clavier), 1 = clavier (jeu d'origine), 2 = Xbox 360, 3 = PS3.
; On-screen button icons: 0 = auto (PS3 with a PlayStation controller, Xbox 360 with another controller, otherwise
; keyboard), 1 = keyboard (original game), 2 = Xbox 360, 3 = PS3.
ButtonIcons=0
; Invite à marteler (QTE) : 1 = icône animée aux couleurs de la manette (Xbox 360 ou PS3), 0 = chiffre animé du PC.
; Button-mashing prompt (QTE): 1 = animated icon in the controller's colors (Xbox 360 or PS3), 0 = the PC's animated digit.
AnimatedIcons=1
; Manette PlayStation (DualShock 4, DualSense) sans Steam Input : présentée au jeu comme une manette Xbox 360 quand
; aucune manette XInput n'est branchée. 0 = non.
; PlayStation controller (DualShock 4, DualSense) without Steam Input: presented to the game as an Xbox 360 controller
; when no XInput controller is plugged in. 0 = no.
PlayStationPad=1
; Accessibilité : pendant une invite à marteler (QTE), maintenir le bouton compte comme des appuis répétés. 0 = non
; (jeu d'origine), 1 = oui. QteHoldRate : appuis par seconde (4 à 15). Manette seulement (clavier et souris inchangés).
; Accessibility: during a button-mashing prompt (QTE), holding the button counts as repeated presses. 0 = no (original
; game), 1 = yes. QteHoldRate: presses per second (4 to 15). Controller only (keyboard and mouse unchanged).
QteHold=0
QteHoldRate=10

[Camera]
; Correctif de caméra à la manette, d'après le Camera Fix d'Emerson Teles (licence MIT) : le personnage tourne avec le
; stick droit et la caméra le suit, tangage proportionnel au stick, sensibilité de visée séparée. 0 = jeu d'origine.
; Avec 1, retirer COMMAND_TURNLEFT et COMMAND_TURNRIGHT du stick droit dans Engine\binds_pc_mjs.cfg (le launcher
; s'en charge), sinon le personnage tourne deux fois plus vite.
; Controller camera fix, based on Emerson Teles' Camera Fix (MIT license): the character turns with the right
; stick and the camera follows, pitch proportional to the stick, separate aiming sensitivity. 0 = original game.
; With 1, remove COMMAND_TURNLEFT and COMMAND_TURNRIGHT from the right stick in Engine\binds_pc_mjs.cfg (the
; launcher does it), otherwise the character turns twice as fast.
CameraFix=1
; Vitesses de 0.25 à 3.0 (1.0 = calibrage d'origine du Camera Fix) : caméra horizontale (et rotation du
; personnage), caméra verticale, visée horizontale, visée verticale.
; Speeds from 0.25 to 3.0 (1.0 = the Camera Fix's original calibration): horizontal camera (and character
; rotation), vertical camera, horizontal aiming, vertical aiming.
HorizontalSpeed=1.0
VerticalSpeed=1.0
AimHorizontalSpeed=1.0
AimVerticalSpeed=1.0
; Stick droit horizontal (avec CameraFix=1) : Follow = le personnage tourne et la caméra le suit (Camera Fix) ;
; Orbit = la caméra tourne seule autour du personnage, sans revenir derrière lui (expérimental, en test).
; Horizontal right stick (with CameraFix=1): Follow = the character turns and the camera follows (Camera Fix);
; Orbit = the camera turns alone around the character, without coming back behind him (experimental, in testing).
Mode=Follow
; Avec Mode=Orbit : 1 = tant que la gâchette gauche (L2, garde au couteau) est tenue, l'orbite est suspendue : la
; caméra revient derrière le personnage et le stick droit le tourne ; 0 = l'orbite reste active.
; With Mode=Orbit: 1 = while the left trigger (L2, knife guard) is held, the orbit is suspended: the camera
; comes back behind the character and the right stick turns him; 0 = the orbit stays active.
OrbitGuardFollow=1

[Cheats]
; Mode dieu : le joueur ne perd plus de vie (et ne consomme plus de munitions). 0 = jeu d'origine.
; God mode: the player no longer loses health (and no longer uses ammunition). 0 = original game.
God=0
; Munitions illimitées : les armes à feu ne consomment plus de munitions. 0 = jeu d'origine.
; Unlimited ammunition: firearms no longer use ammunition. 0 = original game.
UnlimitedAmmo=0

[Debug]
; Nombre de journaux conservés.
; Number of logs kept.
LogKeepCount=30
; Relevé d'images (diagnostic pour le DLSS) : la touche enregistre les 2 images suivantes dans
; HomecomingAgain\captures. Code de touche Windows : 122 = F11.
; Frame capture (DLSS diagnostic): the key saves the next 2 frames in
; HomecomingAgain\captures. Windows key code: 122 = F11.
FrameCapture=0
FrameCaptureKey=122
; Enregistre l'image affichée toutes les 15 s (8 fois) dans HomecomingAgain\captures (écran noir).
; Saves the displayed image every 15 s (8 times) in HomecomingAgain\captures (black screen).
BackBufferDump=0
; Option de test : le jeu ne lit plus ses vidéos (cinématiques), pour arriver plus vite en jeu.
; Test option: the game no longer plays its videos (cutscenes), to reach the gameplay faster.
SkipMovies=0
