name: build

# Chaque push : compilation et tests unitaires.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Environnement MSVC hôte x64, cible x86 (lanceur et moteur 32 bits).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configurer
        run: cmake --preset x86-release

      - name: Compiler
        run: cmake --build --preset x86-release

      - name: Tests unitaires
        run: build/x86-release/HomecomingAgainUnitTests.exe

      # Launcher C# (Avalonia), qui embarque la DLL compilée ci-dessus. msvc-dev-cmd définit Platform=x86 pour la
      # suite du job, que MSBuild rejette pour la solution du launcher : on retire la variable pour ces étapes.
      - name: Tests du launcher
        working-directory: launcher
        run: |
          Remove-Item Env:Platform -ErrorAction SilentlyContinue
          dotnet test -c Release

      - name: Publier le launcher
        run: |
          Remove-Item Env:Platform -ErrorAction SilentlyContinue
          dotnet publish launcher/src/HomecomingAgain.Launcher/HomecomingAgain.Launcher.csproj -c Release -r win-x64 --self-contained -p:DebugType=none -o build/x86-release/package

      - uses: actions/upload-artifact@v4
        with:
          name: HomecomingAgain
          path: build/x86-release/package/

      # Symboles, pour analyser les dumps de plantage qui passent par notre DLL.
      - uses: actions/upload-artifact@v4
        with:
          name: HomecomingAgain-symboles
          path: build/x86-release/version.pdb
