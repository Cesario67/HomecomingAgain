name: build

# Chaque push : compilation et tests unitaires.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Environnement MSVC hôte x64, cible x86 (SilentHill.exe est supposé 32 bits).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Configurer
        run: cmake --preset x86-release

      - name: Compiler
        run: cmake --build --preset x86-release

      - name: Tests unitaires
        run: build/x86-release/SHHFixUnitTests.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SHHFix
          path: build/x86-release/package/

      # Symboles, pour analyser les dumps de plantage qui passent par notre DLL.
      - uses: actions/upload-artifact@v4
        with:
          name: SHHFix-symboles
          path: build/x86-release/version.pdb
